<div class="report-wrap">
  <div class="report-header">
    <h2>Cases by Status</h2>
    <button mat-stroked-button (click)="exportCsv()" [disabled]="!report">
      <mat-icon>download</mat-icon> Export CSV
    </button>
  </div>
  <div *ngIf="loading" class="center-spin"><mat-spinner diameter="40"></mat-spinner></div>
  <div *ngIf="error" class="error-msg">{{ error }}</div>
  <ng-container *ngIf="report && !loading">
    <p class="meta">Total cases: <strong>{{ report.totalCases }}</strong> · Generated {{ report.generatedAt | date:'medium' }}</p>
    <div class="report-row">
      <mat-card class="chart-card">
        <mat-card-content><canvas #chartCanvas height="260"></canvas></mat-card-content>
      </mat-card>
      <mat-card class="table-card">
        <mat-card-content>
          <table mat-table [dataSource]="report.rows">
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let r"><strong>{{ r.status }}</strong></td>
            </ng-container>
            <ng-container matColumnDef="count">
              <th mat-header-cell *matHeaderCellDef>Count</th>
              <td mat-cell *matCellDef="let r">{{ r.count }}</td>
            </ng-container>
            <ng-container matColumnDef="percentage">
              <th mat-header-cell *matHeaderCellDef>%</th>
              <td mat-cell *matCellDef="let r">{{ r.percentage }}%</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns;"></tr>
          </table>
        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>
</div>
