<div class="report-wrap">
  <div class="report-header">
    <h2>Tasks by Assignee</h2>
    <button mat-stroked-button (click)="exportCsv()" [disabled]="!report">
      <mat-icon>download</mat-icon> Export CSV
    </button>
  </div>
  <div *ngIf="loading" class="center-spin"><mat-spinner diameter="40"></mat-spinner></div>
  <div *ngIf="error" class="error-msg">{{ error }}</div>
  <ng-container *ngIf="report && !loading">
    <p class="meta">Generated {{ report.generatedAt | date:'medium' }}</p>
    <div *ngIf="!report.rows.length" class="empty">No tasks assigned yet.</div>
    <div class="report-col" *ngIf="report.rows.length">
      <mat-card>
        <mat-card-content><canvas #stackedCanvas height="260"></canvas></mat-card-content>
      </mat-card>
      <mat-card>
        <mat-card-content>
          <table mat-table [dataSource]="report.rows">
            <ng-container matColumnDef="userName"><th mat-header-cell *matHeaderCellDef>User</th><td mat-cell *matCellDef="let r"><strong>{{ r.userName }}</strong></td></ng-container>
            <ng-container matColumnDef="totalTasks"><th mat-header-cell *matHeaderCellDef>Total</th><td mat-cell *matCellDef="let r">{{ r.totalTasks }}</td></ng-container>
            <ng-container matColumnDef="doneTasks"><th mat-header-cell *matHeaderCellDef>Done</th><td mat-cell *matCellDef="let r" class="done">{{ r.doneTasks }}</td></ng-container>
            <ng-container matColumnDef="inProgressTasks"><th mat-header-cell *matHeaderCellDef>In Progress</th><td mat-cell *matCellDef="let r">{{ r.inProgressTasks }}</td></ng-container>
            <ng-container matColumnDef="overdueTasks"><th mat-header-cell *matHeaderCellDef>Overdue</th><td mat-cell *matCellDef="let r" class="overdue">{{ r.overdueTasks }}</td></ng-container>
            <ng-container matColumnDef="openTasks"><th mat-header-cell *matHeaderCellDef>Open</th><td mat-cell *matCellDef="let r">{{ r.openTasks }}</td></ng-container>
            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns;"></tr>
          </table>
        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>
</div>
