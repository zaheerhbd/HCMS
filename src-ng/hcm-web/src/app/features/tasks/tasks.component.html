<div class="page-header">
  <div class="header-left">
    <h1>My Tasks</h1>
    <span class="overdue-chip" *ngIf="overdueCount > 0">{{ overdueCount }} overdue</span>
  </div>
  <button mat-icon-button (click)="load()" matTooltip="Refresh" [disabled]="loading">
    <mat-icon>refresh</mat-icon>
  </button>
</div>

<div *ngIf="loading" class="spinner-wrap">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="tasks" *ngIf="!loading && tasks.length > 0" class="tasks-table">

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Task</th>
    <td mat-cell *matCellDef="let t">
      <div class="task-title" [class.overdue-title]="isOverdue(t)">
        <mat-icon *ngIf="isOverdue(t)" class="warn-icon">warning</mat-icon>
        {{ t.title }}
      </div>
      <div *ngIf="t.description" class="task-desc">{{ t.description }}</div>
    </td>
  </ng-container>

  <ng-container matColumnDef="caseNumber">
    <th mat-header-cell *matHeaderCellDef>Case</th>
    <td mat-cell *matCellDef="let t">
      <a *ngIf="t.caseNumber" [routerLink]="['/cases', t.caseNumber]" class="case-link">
        {{ t.caseNumber }}
      </a>
      <span *ngIf="!t.caseNumber" class="muted">—</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="priority">
    <th mat-header-cell *matHeaderCellDef>Priority</th>
    <td mat-cell *matCellDef="let t">
      <span class="priority-badge" [class]="'priority-' + t.priority.toLowerCase()">{{ t.priority }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let t">
      <mat-select [value]="t.status" (selectionChange)="changeStatus(t, $event.value)"
        class="status-select" [style.color]="statusColor(t.status)">
        <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
      </mat-select>
    </td>
  </ng-container>

  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef>Due</th>
    <td mat-cell *matCellDef="let t">
      <span *ngIf="t.dueDate" [class.overdue]="isOverdue(t)">{{ t.dueDate | date:'mediumDate' }}</span>
      <span *ngIf="!t.dueDate" class="muted">—</span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"></tr>
</table>

<div *ngIf="!loading && tasks.length === 0" class="empty-state">
  <mat-icon class="empty-icon">task_alt</mat-icon>
  <p>No active tasks assigned to you.</p>
</div>
