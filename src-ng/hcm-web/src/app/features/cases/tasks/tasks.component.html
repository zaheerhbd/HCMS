<!-- Add task form — visible to CareCoordinator, Supervisor, Admin -->
<div *ngIf="canManage" class="add-form">
  <form [formGroup]="addForm" (ngSubmit)="createTask()">
    <mat-form-field appearance="outline" class="field-title">
      <mat-label>Task Title</mat-label>
      <input matInput formControlName="title" placeholder="e.g. Schedule follow-up call">
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-medium">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option value="Low">Low</mat-option>
        <mat-option value="Medium">Medium</mat-option>
        <mat-option value="High">High</mat-option>
        <mat-option value="Critical">Critical</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-medium">
      <mat-label>Assign To</mat-label>
      <mat-select formControlName="assignedTo">
        <mat-option [value]="null">Unassigned</mat-option>
        <mat-option *ngFor="let u of assignableUsers" [value]="u.id">{{ u.fullName }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-medium">
      <mat-label>Due Date</mat-label>
      <input matInput type="date" formControlName="dueDate">
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit" [disabled]="addForm.invalid || adding">
      <mat-icon>add</mat-icon> Add Task
    </button>
  </form>
</div>

<!-- Task table. Done/Cancelled rows are dimmed. Overdue dates highlight in red -->
<table mat-table [dataSource]="tasks" *ngIf="tasks.length > 0" class="tasks-table">

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Task</th>
    <td mat-cell *matCellDef="let t">
      <div class="task-title">{{ t.title }}</div>
      <div class="task-assignee" *ngIf="t.assignedToUserName">{{ t.assignedToUserName }}</div>
    </td>
  </ng-container>

  <ng-container matColumnDef="priority">
    <th mat-header-cell *matHeaderCellDef>Priority</th>
    <td mat-cell *matCellDef="let t">
      <span class="priority-badge" [class]="'priority-' + t.priority.toLowerCase()">{{ t.priority }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let t">
      <!-- Inline dropdown: changing it calls the status endpoint immediately -->
      <mat-select [value]="t.status" (selectionChange)="changeStatus(t, $event.value)"
        class="status-select" [style.color]="statusColor(t.status)">
        <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
      </mat-select>
    </td>
  </ng-container>

  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef>Due</th>
    <td mat-cell *matCellDef="let t">
      <span *ngIf="t.dueDate" [class.overdue]="isOverdue(t)">
        {{ t.dueDate | date:'mediumDate' }}
      </span>
      <span *ngIf="!t.dueDate" class="muted">—</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let t">
      <button mat-icon-button color="warn"
        *ngIf="canManage && t.status !== 'Cancelled' && t.status !== 'Done'"
        (click)="cancelTask(t)"
        matTooltip="Cancel task">
        <mat-icon>cancel</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"
    [class.done-row]="row.status === 'Done' || row.status === 'Cancelled'"></tr>
</table>

<div *ngIf="tasks.length === 0" class="empty">No tasks yet.</div>
