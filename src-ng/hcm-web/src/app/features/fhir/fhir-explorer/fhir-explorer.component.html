<div class="page-container">
  <h1>FHIR R4 Explorer</h1>
  <p class="subtitle">Fetch any FHIR resource by type and ID to inspect the raw JSON representation.</p>

  <mat-card class="query-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="fetch()" class="query-form">
        <mat-form-field appearance="outline">
          <mat-label>Resource Type</mat-label>
          <mat-select formControlName="resourceType">
            <mat-option *ngFor="let t of resourceTypes" [value]="t">{{ t }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" *ngIf="form.value.resourceType !== 'metadata'">
          <mat-label>Resource ID (MRN, CaseNumber, or GUID)</mat-label>
          <input matInput formControlName="id" placeholder="e.g. MRN-2026-00001" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="loading">
          <mat-icon>search</mat-icon> Fetch
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <div *ngIf="loading" class="spinner-wrap">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <mat-card *ngIf="result && !loading" class="result-card">
    <mat-card-header>
      <mat-card-title>Result</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <ngx-json-viewer [json]="result" [expanded]="true"></ngx-json-viewer>
    </mat-card-content>
  </mat-card>
</div>
